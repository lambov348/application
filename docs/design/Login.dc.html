<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;color:#16181D;background:#F4F3EF}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 32px; display: flex; flex-direction: column; gap: 28px; background: #F4F3EF; font-family: 'Onest', system-ui, sans-serif; color: #16181D;">
<div role="group" aria-label="{{t.langLabel}}" style="align-self: flex-end; display: flex; padding: 3px; gap: 2px; background: #E9E7E1; border-radius: 10px;">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="min-width: 44px; height: 38px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700; background: {{l.bg}}; color: {{l.fg}};">{{l.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
<div style="width: 64px; height: 64px; border-radius: 18px; background: #16181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px;">M24</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em;">MöbelStock24</div>
<div style="font-size: 15px; color: #585C63;">{{t.sub}}</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 20px; padding: 24px;">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600;">{{t.login}}
<input type="text" value="dmitri.k" style="height: 52px; padding: 0 16px; border: 1px solid #D9D6CF; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 400; color: #16181D; background: #FFFFFF;">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600;">{{t.pass}}
<input type="password" value="password" style="height: 52px; padding: 0 16px; border: 1px solid #D9D6CF; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 400; color: #16181D; background: #FFFFFF;">
</label>
<a href="WorkerHome.dc.html" style="height: 54px; border-radius: 14px; background: #0F6B5C; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">{{t.enter}}</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F6F5F1; font-size: 13px; color: #3D4047; line-height: 1.4;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span>{{t.hint}}</span>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: #585C63; text-align: center;">
<span>{{t.foot1}}</span>
<span>{{t.foot2}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"lang":{"editor":"enum","options":["ru","en","de"],"default":"ru"}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    var T = {
      ru: { langLabel: 'Язык', sub: 'Рабочая система', login: 'Логин', pass: 'Пароль', enter: 'Войти', hint: 'Первый вход — придумайте свой пароль', foot1: 'Аккаунты создаёт только администратор', foot2: 'Данные хранятся на сервере в Германии' },
      en: { langLabel: 'Language', sub: 'Work system', login: 'Username', pass: 'Password', enter: 'Sign in', hint: 'First sign-in: choose your own password', foot1: 'Accounts are created by the administrator only', foot2: 'Data is stored on a server in Germany' },
      de: { langLabel: 'Sprache', sub: 'Arbeitssystem', login: 'Benutzername', pass: 'Passwort', enter: 'Anmelden', hint: 'Erste Anmeldung: eigenes Passwort festlegen', foot1: 'Konten legt nur der Administrator an', foot2: 'Daten werden auf einem Server in Deutschland gespeichert' }
    };
    var langs = [['ru', 'RU'], ['en', 'EN'], ['de', 'DE']].map(function (p) {
      var on = p[0] === lang;
      return { label: p[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#16181D' : '#3D4047', pick: function () { self.setState({ lang: p[0] }); } };
    });
    return { t: T[lang] || T.ru, langs: langs };
  }
}
</script>
</body>
</html>
