<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Работник — задание</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;color:#16181D;background:#F4F3EF}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F3EF; font-family: 'Onest', system-ui, sans-serif; color: #16181D;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px;">
<a href="WorkerHome.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; font-size: 15px; font-weight: 600; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>{{t.back}}</a>
<div role="group" aria-label="{{t.langLabel}}" style="display: flex; padding: 3px; gap: 2px; background: #E9E7E1; border-radius: 10px;">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="min-width: 44px; height: 38px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700; background: {{l.bg}}; color: {{l.fg}};">{{l.label}}</button>
</sc-for>
</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 20px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; color: #585C63;">#2026-0412</span>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.02em;">{{t.title}}</h1>
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #E4ECF7; color: #1F4E8C;">{{t.status}}</span>
</div>

<section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 16px; font-weight: 600;">Anna Becker</span>
<span style="font-size: 14px; color: #585C63;">Musterstraße 12, 10115 Berlin</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<a href="#" style="height: 46px; border-radius: 12px; background: #0F6B5C; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{t.route}}</a>
<a href="#" style="height: 46px; border-radius: 12px; border: 1px solid #D9D6CF; background: #FFFFFF; color: #16181D; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>{{t.call}}</a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EEECE7; padding-top: 12px;">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px;"><span style="color: #585C63;">{{f.label}}</span><span style="font-weight: 600; text-align: right;">{{f.value}}</span></div>
</sc-for>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 0 0 6px; font-size: 16px; font-weight: 600;">{{t.todo}}</h2>
<sc-for list="{{todo}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.pressed}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; font-family: inherit; font-size: 15px; color: #16181D; text-align: left;">
<span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; border: 1.5px solid {{c.border}}; background: {{c.fill}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="color: {{c.color}};">{{c.text}}</span>
</button>
</sc-for>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 16px; font-weight: 600;">{{t.before}}</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<div style="height: 72px; border-radius: 10px; background: #E6E3DC;"></div>
<div style="height: 72px; border-radius: 10px; background: #E6E3DC;"></div>
<div style="height: 72px; border-radius: 10px; background: #E6E3DC;"></div>
<div style="height: 72px; border-radius: 10px; background: #E6E3DC;"></div>
</div>
<h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 600;">{{t.after}}</h2>
<button type="button" style="height: 88px; border-radius: 12px; border: 1.5px dashed #9C988F; background: #FAFAF8; font-family: inherit; font-size: 15px; font-weight: 600; color: #16181D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>{{t.shoot}}</button>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 16px; font-weight: 600;">{{t.files}}</h2>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; color: #16181D;">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #F4F3EF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">PDF</span>
<span style="display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">{{t.plan}}</span><span style="font-size: 13px; color: #585C63;">Kuechenplan_Becker.pdf</span></span>
</a>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 600;">{{t.note}}
<textarea rows="3" placeholder="{{t.notePh}}" style="font-family: inherit; font-size: 15px; font-weight: 400; padding: 12px; border: 1px solid #D9D6CF; border-radius: 12px; resize: none; color: #16181D;"></textarea>
</label>
</section>
</div>

<div style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #E4E2DC; display: flex; flex-direction: column; gap: 8px;">
<button type="button" style="height: 54px; border: 0; border-radius: 14px; background: #16181D; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600;">{{t.finish}}</button>
<span style="font-size: 13px; color: #585C63; text-align: center;">{{t.needPhotos}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240},"lang":{"editor":"enum","options":["ru","en","de"],"default":"ru"}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    var T = {
      ru: { back: 'Задания', langLabel: 'Язык', title: 'Монтаж кухни', status: 'В работе · 3 ч 42 мин', route: 'Маршрут', call: 'Позвонить',
        fTermin: 'Термин', vTermin: 'сегодня, 09:00–15:00', fFloor: 'Этаж', vFloor: '3, лифт есть', fPark: 'Парковка', vPark: 'у входа, согласовано', fWith: 'С вами',
        todo: 'Что сделать', c: ['Демонтаж старой кухни', 'Нижние модули, 7 шт.', 'Верхние модули, 5 шт.', 'Врезка мойки и варочной', 'Вытяжка и цоколь'],
        before: 'Фото до', after: 'Фото после', shoot: 'Сфотографировать', files: 'Файлы', plan: 'План кухни', note: 'Замечание для офиса', notePh: 'Что не так, чего не хватает, что сказал клиент', finish: 'Завершить заказ', needPhotos: 'Нужно минимум 2 фото «после»' },
      en: { back: 'Jobs', langLabel: 'Language', title: 'Kitchen installation', status: 'In progress · 3 h 42 min', route: 'Directions', call: 'Call',
        fTermin: 'Appointment', vTermin: 'today, 09:00–15:00', fFloor: 'Floor', vFloor: '3rd, lift available', fPark: 'Parking', vPark: 'at the entrance, agreed', fWith: 'With you',
        todo: 'To do', c: ['Remove old kitchen', 'Base units, 7 pcs', 'Wall units, 5 pcs', 'Cut-outs for sink and hob', 'Hood and plinth'],
        before: 'Photos before', after: 'Photos after', shoot: 'Take photo', files: 'Files', plan: 'Kitchen plan', note: 'Note for the office', notePh: 'What is wrong, what is missing, what the client said', finish: 'Complete job', needPhotos: 'At least 2 “after” photos required' },
      de: { back: 'Aufträge', langLabel: 'Sprache', title: 'Küchenmontage', status: 'In Arbeit · 3 Std. 42 Min.', route: 'Route', call: 'Anrufen',
        fTermin: 'Termin', vTermin: 'heute, 09:00–15:00', fFloor: 'Etage', vFloor: '3. OG, mit Aufzug', fPark: 'Parken', vPark: 'vor dem Eingang, abgesprochen', fWith: 'Mit Ihnen',
        todo: 'Zu erledigen', c: ['Alte Küche abbauen', 'Unterschränke, 7 Stk.', 'Oberschränke, 5 Stk.', 'Ausschnitte für Spüle und Kochfeld', 'Dunstabzug und Sockel'],
        before: 'Fotos vorher', after: 'Fotos nachher', shoot: 'Foto aufnehmen', files: 'Dateien', plan: 'Küchenplan', note: 'Notiz fürs Büro', notePh: 'Was fehlt, was stimmt nicht, was hat der Kunde gesagt', finish: 'Auftrag abschließen', needPhotos: 'Mindestens 2 Fotos „nachher“ nötig' }
    };
    var t = T[lang] || T.ru;
    var done = [true, true, false, false, false];
    var langs = [['ru', 'RU'], ['en', 'EN'], ['de', 'DE']].map(function (p) {
      var on = p[0] === lang;
      return { label: p[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#16181D' : '#3D4047', pick: function () { self.setState({ lang: p[0] }); } };
    });
    return {
      t: t,
      langs: langs,
      facts: [
        { label: t.fTermin, value: t.vTermin },
        { label: t.fFloor, value: t.vFloor },
        { label: t.fPark, value: t.vPark },
        { label: t.fWith, value: 'Oleg S.' }
      ],
      todo: t.c.map(function (text, i) {
        var d = done[i];
        return { text: text, pressed: d ? 'true' : 'false', border: d ? '#0F6B5C' : '#9C988F', fill: d ? '#0F6B5C' : '#FFFFFF', color: d ? '#585C63' : '#16181D' };
      })
    };
  }
}
</script>
</body>
</html>
