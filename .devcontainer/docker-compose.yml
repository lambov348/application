services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Same network as the database, so PostgreSQL and Redis are on localhost.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: moebel
      POSTGRES_PASSWORD: moebel
      POSTGRES_DB: moebelstock24
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  redis:
    image: redis:7
    restart: unless-stopped
    network_mode: service:db

volumes:
  postgres-data:
